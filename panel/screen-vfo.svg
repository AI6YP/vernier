<svg width="385" height="120" viewBox="0 0 385 120" unit="mm"
  version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <style>
    text { font-family: monospace; font-size: 2mm; text-anchor: middle; alignment-baseline: middle; }
  </style>
  <!-- Central LCD assembly -->
  <g id="screen" transform="translate(110, 10)">
    <!-- panel PCB -->
    <g id="panel-pcb" transform="translate(-6, -2)">
      <rect x="0" y="0" width="177" height="104" rx="2" fill="#333" id="panel-pcb-body" />
      <!-- 4 x M3 mounting holes in corners -->
      <circle cx="3" cy="3" r="2" fill="#000" id="panel-hole-tl"/>
      <circle cx="3" cy="101" r="2" fill="#000" id="panel-hole-bl"/>
      <circle cx="174" cy="3" r="2" fill="#000" id="panel-hole-tr"/>
      <circle cx="174" cy="101" r="2" fill="#000" id="panel-hole-br"/>
    </g>
    <!-- 7" LCD panel -->
    <g id="lcd-panel" transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="100" fill="#222" id="panel-glass" />
      <rect x="4" y="5" width="155" height="86" fill="#000" id="panel-view-port" />
    </g>
  </g>
  <!-- VFO panel on the right -->
  <g id="vfo-panel" transform="translate(275, 10)">
    <rect x="0" y="0" width="100" height="100" fill="#0000ff78" id="vfo-panel-pcb" />
    <!-- 5 x cherry MX switches F1 .. F5 -->
    <g id="vfo-fn-switches" transform="translate(2, 2)">
      <!-- for(let y = 0; y < 90; y += 19.05) { -->
      <g id="vfo-fn-switch-f1" transform="translate(0, 0)">
        <rect x="0" y="0" width="14" height="14" fill="#000" id="vfo-fn-switch-f1-pcb-hole"/>
        <rect x="-2" y="-2" width="18" height="18" fill="#ffffff44" id="vfo-fn-switch-f1-cap"/>
        <text x="7" y="7">F1</text>
      </g>
      <g id="vfo-fn-switch-f2" transform="translate(0, 19.05)">
        <rect x="0" y="0" width="14" height="14" fill="#000" id="vfo-fn-switch-f2-pcb-hole"/>
        <rect x="-2" y="-2" width="18" height="18" fill="#ffffff44" id="vfo-fn-switch-f2-cap"/>
        <text x="7" y="7">F2</text>
      </g>
      <g id="vfo-fn-switch-f3" transform="translate(0, 38.1)">
        <rect x="0" y="0" width="14" height="14" fill="#000" id="vfo-fn-switch-f3-pcb-hole"/>
        <rect x="-2" y="-2" width="18" height="18" fill="#ffffff44" id="vfo-fn-switch-f3-cap"/>
        <text x="7" y="7">F3</text>
      </g>
      <g id="vfo-fn-switch-f4" transform="translate(0, 57.15)">
        <rect x="0" y="0" width="14" height="14" fill="#000" id="vfo-fn-switch-f4-pcb-hole"/>
        <rect x="-2" y="-2" width="18" height="18" fill="#ffffff44" id="vfo-fn-switch-f4-cap"/>
        <text x="7" y="7">F4</text>
      </g>
      <g id="vfo-fn-switch-f5" transform="translate(0, 76.2)">
        <rect x="0" y="0" width="14" height="14" fill="#000" id="vfo-fn-switch-f5-pcb-hole"/>
        <rect x="-2" y="-2" width="18" height="18" fill="#ffffff44" id="vfo-fn-switch-f5-cap"/>
        <text x="7" y="7">F5</text>
      </g>
      <!-- } -->
    </g>
    <!-- VFO knob -->
    <g id="vfo-knob" transform="translate(50, 70)">
      <circle cx="0" cy="0" r="25" fill="#ffffff44" id="vfo-knob"/>
    </g>
  </g>
</svg>