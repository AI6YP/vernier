<!DOCTYPE html>
<html lang="en">
<html><head>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code" rel="stylesheet">
<style>
  body {
  background: #ccc;
  }
  .b612 {
    font-family: 'B612 Mono';
    font-size: 24px;
    font-smooth: never;
    -webkit-font-smoothing: none;
  }
  .iosevka {
    font-family: 'Iosevka Drom';
    font-size: 64px;
    font-smooth: never;
    -webkit-font-smoothing: none;
  }
  .robot {
    font-family: 'Roboto Mono';
    font-size: 24px;
    font-smooth: never;
    -webkit-font-smoothing: none;
  }
  .fira {
    font-family: 'Fira Code';
    font-size: 24px;
    font-smooth: never;
    -webkit-font-smoothing: none;
  }
  canvas {
    text-rendering: geometricPrecision;
  }
  text {
  margin: 0px;
  padding: 0px;
  font-smooth: never;
    font-smooth: never;
    -webkit-font-smoothing: none;
  }
</style>
<script src="onml.js"></script>
<!-- <script src="gen-va-skins.js"></script> -->
<script>
// const ascii2  = c => (c < 150) ? '@' : '.';

const loadFont = (name, url) => {
  const font = new FontFace(name, `url(${url})`);
  document.fonts.add(font);
  font.load();
  return font;
};

const svg2canvas = (root, skinSvg) => {
  const tempImg = document.createElement('img');
  tempImg.src = 'data:image/svg+xml,' + encodeURIComponent(skinSvg);
  return new Promise((resolve, reject) => {
    tempImg.addEventListener('load', (e) => {
      root.append(e.target);
      const sbox = e.target.getBoundingClientRect();
      // console.log(sbox);
      const cnvs = document.createElement('canvas');
      root.append(cnvs);
      cnvs.width = Math.round(sbox.width);
      cnvs.height = Math.round(sbox.height);
      const ctx = cnvs.getContext('2d',{
        antialias: false,
        willReadFrequently: true
      });
      ctx.drawImage(e.target, 0, 0);
      resolve(cnvs)
    });
  });
};

const canvas2h = (cnvs, letters, fontSpecs) => {
  let res = '';

  const ctx = cnvs.getContext('2d', {
    antialias: false,
    willReadFrequently: true
  });

  let offsetH = 0;
  for (const fontSpec of fontSpecs) {
    const lw = fontSpec.w;
    const width = letters.length * lw;
    const height = fontSpec.h;

    // extract bitmap data from canvas
    const imgDat = ctx.getImageData(0, offsetH, width, height).data;
    const bitMap = new Uint8Array(imgDat.length / 4 / 8);
    for (let i = 0; i < bitMap.length; i++) {
      let byte = 0;
      for (let j = 3; j < 32; j += 4) {
        const bit = (imgDat[i * 32 + j] > 128) ? 1 : 0;
        byte = (byte << 1) | bit;
      }
      bitMap[i] = byte;
    }

    { // ascii art of the font letters as comment
      let str = '';
      for (let i = 0; i < bitMap.length; i++) {
        let byte = bitMap[i];
        for (let j = 7; j >= 0; j--) {
          str += ((byte >> j) & 1) ? '@' : '.';
        }
        if ((i % 2) === 1) {
          str += ' ';
        }
        if ((i % (width / 8)) === (width / 8 - 1)) {
          str += '\n';
        }
      }
      res += '/*\n' + str + '*/';
    }

    res += `
#ifndef _IOSEVKA_${fontSpec.w}_${fontSpec.h}_H_
#define _IOSEVKA_${fontSpec.w}_${fontSpec.h}_H_

// Width: ${width} Height: ${height}

DRAM_ATTR static uint8_t iosevka_${fontSpec.w}_${fontSpec.h}[${bitMap.length}] = {
`;

    for (let lidx = 0; lidx < letters.length; lidx++) {
      let str = '  ';
      // for (let y = 0; y < height; y++) { // normal
      for (let y = height - 1; y >= 0; y--) { // inverted
        const xoffset = lidx * lw / 8;
        for (let x = xoffset; x < xoffset + lw / 8; x++) {
          str += '0x' + (bitMap[x + y * width / 8]).toString(16).padStart(2, 0) + ', ';
        }
      }
      res += str + '// ' + letters[lidx] + '\n';
    }
    res += `};

  #endif

  `;
    offsetH += height + 8;
  }

  console.log(res);
};

const MAIN = async () => {
  const loadIosevka = loadFont('Iosevka Drom', 'https://vc.drom.io/IosevkaDrom-Regular.woff2');
  const root = document.getElementById('root');
  const skin = document.getElementById('skin');
  const fontSpecs = [
    {w: 64, h: 96, font: 'Iosevka', size: 128},
    {w: 32, h: 48, font: 'Iosevka', size: 64}
  ];

  const letters = '0123456789.';
  const maxW = Math.max(...fontSpecs.map((fs) => fs.w));
  const totalH = fontSpecs.reduce((res, fs) => res + fs.h + 8, 0);
  const svg = onml.gen.svg(letters.length * maxW, totalH);
  let offsetH = 0;
  for (const fontSpec of fontSpecs) {
    svg.push(['text', {
      x: 0,
      y: offsetH + fontSpec.h - 0.6,
      fill: '#000',
      'font-family': fontSpec.font,
      'font-size': fontSpec.size + 'px'
    },
    letters
    ]);
    offsetH += fontSpec.h + 8;
  }
  const svgText = onml.stringify(svg);

  const cnvs = await svg2canvas(root, svgText);
  canvas2h(cnvs, letters.split(''), fontSpecs);
};
</script>
</head>
<body onload="MAIN()">
<div class="iosevka" id="root"></div>
</body>
</html>
